<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría de Crecimiento | Reserva tu Sesión</title>

    <!-- Google Tag Manager -->
    <!-- AQUÍ PEGAREMOS EL CÓDIGO DE GTM MÁS ADELANTE -->
    <!-- End Google Tag Manager -->

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        h1 { font-size: 2rem; margin-bottom: 12px; color: #ffffff; }
        p { color: #94a3b8; font-size: 1rem; margin-bottom: 24px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 1rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #7dd3fc; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Impulsa tu Crecimiento</h1>
        <p>Déjanos tus datos y agendaremos una auditoría de 30 minutos sin costo para analizar tus números.</p>

        <!-- Formulario configurado para ir directo a gracias.html -->
        <form action="gracias.html" method="GET">
            <div class="form-group">
                <label for="nombre">Nombre completo *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico *</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>

            <div class="form-group">
                <label for="empresa">Empresa / Proyecto</label>
                <input type="text" id="empresa" name="empresa" placeholder="Nombre de tu empresa">
            </div>

            <button type="submit">Solicitar Auditoría Gratis</button>
        </form>
    </div>

</body>
</html>
